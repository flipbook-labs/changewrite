name: Build

on:
  workflow_call:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
            zip_name: changewrite-macos-arm64.zip
          - os: linux
            runner: ubuntu-latest
            zip_name: changewrite-linux-x86_64.zip
          - os: windows
            runner: windows-latest
            binary: build/changewrite.exe
            zip_name: changewrite-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v7

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0

      # `lute compile` bundles every file under its path from the deepest folder
      # they all share, and inside the binary `~/` aliases like the ones in
      # `.config.luau` resolve against that folder. So the build works only when
      # the home folder, which holds the Loom store, is that shared folder. On
      # Linux and macOS it already is. On Windows runners the checkout is on D:
      # and the home folder on C:, so this points `USERPROFILE`, where Lute finds
      # the home folder on Windows, at the folder two levels above the checkout.
      # The temp folder moves to D: as well, because `lute pkg install` downloads
      # each package there and then moves it into the store, and that move fails
      # across drives.
      - name: Put the Loom store beside the checkout
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          home="$(dirname "$(dirname "$(cygpath -m "$GITHUB_WORKSPACE")")")"
          tmp="$(cygpath -m "$RUNNER_TEMP")/tmp"
          mkdir -p "$tmp"
          {
            echo "USERPROFILE=$home"
            echo "TEMP=$tmp"
            echo "TMP=$tmp"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: lute run install

      - name: Build changewrite
        run: lute run build

      - name: Smoketest
        shell: bash
        run: |
          "${{ matrix.binary || 'build/changewrite' }}" --help

      - name: Install zip (Windows)
        if: matrix.os == 'windows'
        run: choco install zip --yes --no-progress

      - name: Package binary
        shell: bash
        run: zip -j "${{ matrix.zip_name }}" "${{ matrix.binary || 'build/changewrite' }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.zip_name }}
          path: ${{ matrix.zip_name }}
